name: Android APK Build

on:
  push:
    branches:
      - android/react-native
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type: standalone = testable APK (debug-signed, JS embedded), store = signed with release keystore'
        required: true
        default: 'standalone'
        type: choice
        options:
          - standalone
          - store

jobs:
  build:
    name: Build ${{ github.event.inputs.build_type || 'standalone' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Java 17 (required for modern Android Gradle) ──────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Node 20 ───────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Accept Android SDK licenses ───────────────────────────────────────────
      - name: Accept SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      # ── Install JS deps ───────────────────────────────────────────────────────
      - name: Install dependencies
        working-directory: android
        run: npm install --legacy-peer-deps

      # ── google-services.json ──────────────────────────────────────────────────
      # For push notifications. Provide GOOGLE_SERVICES_JSON secret in repo settings.
      # If not set, push notifications won't work but the build will succeed.
      - name: Write google-services.json
        working-directory: android
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json
          else
            cat > google-services.json << 'EOF'
          {
            "project_info": { "project_id": "placeholder", "project_number": "000000000000" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.familybudget.app" } },
              "api_key": [{ "current_key": "placeholder" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      # ── Expo prebuild → generate native Android project ──────────────────────
      - name: Expo prebuild
        working-directory: android
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      # ── Gradle build ─────────────────────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: android/android
        run: chmod +x gradlew

      # Standalone build: assembleRelease embeds the JS bundle so the APK works
      # without a Metro dev server. Expo's generated build.gradle signs the
      # release buildType with the debug keystore by default — installable for
      # testing, but NOT suitable for Google Play.
      - name: Build standalone APK
        if: ${{ github.event.inputs.build_type != 'store' }}
        working-directory: android/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

      - name: Build store APK
        if: ${{ github.event.inputs.build_type == 'store' }}
        working-directory: android/android
        run: |
          # Write keystore from secret and switch release signing to it
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
          echo "apply from: '../../release-signing.gradle'" >> app/build.gradle
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
          KEYSTORE_PATH: release.jks
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── Upload APK ────────────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-budget-${{ github.event.inputs.build_type || 'standalone' }}-${{ github.run_number }}
          path: android/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ── Print download instructions ───────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## ✅ APK собран" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Тип:** ${{ github.event.inputs.build_type || 'standalone' }} (JS-бандл встроен, Metro не нужен)" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Скачать: Actions → этот запуск → Artifacts → \`family-budget-*\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Установка на устройство" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "adb install app-release.apk" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "Или просто отправьте APK-файл тестировщику — он устанавливается напрямую." >> $GITHUB_STEP_SUMMARY

name: Android APK Build

on:
  push:
    branches:
      - android/react-native
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'standalone = test APK; store = signed AAB+APK; demo = separate demo app (lena/Lena)'
        required: true
        default: 'standalone'
        type: choice
        options:
          - standalone
          - store
          - demo

jobs:
  build:
    name: Build ${{ github.event.inputs.build_type || 'standalone' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Resolved build type: dispatch input, or 'standalone' for push builds.
      # To build a Google Play AAB: Run workflow → build_type: store.
      BT: ${{ github.event.inputs.build_type || 'standalone' }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Java 17 (required for modern Android Gradle) ──────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Node 20 ───────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Accept Android SDK licenses ───────────────────────────────────────────
      - name: Accept SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      # ── Install JS deps ───────────────────────────────────────────────────────
      - name: Install dependencies
        working-directory: android
        run: npm install --legacy-peer-deps

      # ── google-services.json ──────────────────────────────────────────────────
      # For push notifications. Provide GOOGLE_SERVICES_JSON secret in repo settings.
      # If not set, push notifications won't work but the build will succeed.
      - name: Write google-services.json
        working-directory: android
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json
          else
            cat > google-services.json << 'EOF'
          {
            "project_info": { "project_id": "placeholder", "project_number": "000000000000" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.familybudget.app" } },
              "api_key": [{ "current_key": "placeholder" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      # ── Expo prebuild → generate native Android project ──────────────────────
      - name: Expo prebuild
        working-directory: android
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1
          # demo → app.config.js подставляет package .demo, имя «Демо», isDemo
          APP_VARIANT: ${{ env.BT == 'demo' && 'demo' || '' }}
          # versionCode = номер запуска CI (монотонно растёт) → всегда больше
          # предыдущего, RuStore/Play не отклоняют сборку. Прошивается в манифест
          # на этапе prebuild через app.config.js.
          APP_VERSION_CODE: ${{ github.run_number }}

      # ── Gradle build ─────────────────────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: android/android
        run: chmod +x gradlew

      # Init-скрипт устойчивости: Sonatype snapshots-репозиторий должен отдавать
      # только -SNAPSHOT версии. Иначе Gradle пытается тянуть оттуда релизные
      # артефакты (kotlin-stdlib) и падает на его периодических 504-таймаутах.
      - name: Write Gradle repo-resilience init script
        run: |
          cat > /tmp/ci-init.gradle << 'EOF'
          def restrict = { repos ->
            repos.all { repo ->
              if (repo instanceof MavenArtifactRepository) {
                def u = repo.url?.toString() ?: ''
                if (u.contains('oss.sonatype.org') && u.contains('snapshots')) {
                  repo.mavenContent { snapshotsOnly() }
                }
              }
            }
          }
          settingsEvaluated { s ->
            restrict(s.pluginManagement.repositories)
            try { restrict(s.dependencyResolutionManagement.repositories) } catch (ignored) {}
          }
          allprojects { p ->
            restrict(p.repositories)
            restrict(p.buildscript.repositories)
          }
          EOF

      # Standalone build: assembleRelease embeds the JS bundle so the APK works
      # without a Metro dev server. Expo's generated build.gradle signs the
      # release buildType with the debug keystore by default — installable for
      # testing, but NOT suitable for Google Play.
      - name: Build standalone APK
        if: ${{ env.BT != 'store' }}
        working-directory: android/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --init-script /tmp/ci-init.gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
          # demo → Expo вшивает флаг в JS-бандл (включает вход по паролю lena/Lena)
          EXPO_PUBLIC_APP_VARIANT: ${{ env.BT == 'demo' && 'demo' || '' }}

      # Store build: signed .aab (Google Play) AND a signed release .apk (RuStore).
      # RuStore wants the signing key uploaded for an AAB, but accepts a
      # fully-signed APK as-is — so we ship both and let you pick.
      - name: Build store AAB + signed APK
        if: ${{ env.BT == 'store' }}
        working-directory: android/android
        run: |
          # Write keystore from secret and switch release signing to it.
          # Leading newline is required: the Expo-generated build.gradle has no
          # trailing newline, so a bare append would glue onto the last statement
          # and Groovy would parse it as apply(...).apply(...) → NPE.
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
          printf '\napply from: "../../release-signing.gradle"\n' >> app/build.gradle
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace --init-script /tmp/ci-init.gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
          KEYSTORE_PATH: release.jks
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── Upload build ──────────────────────────────────────────────────────────
      # store → signed .aab (Play) + signed .apk (RuStore); standalone → test .apk
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: family-budget-${{ env.BT }}-${{ github.run_number }}
          path: ${{ env.BT == 'store' && 'android/android/app/build/outputs/*/release/app-release.*' || 'android/android/app/build/outputs/apk/release/app-release.apk' }}
          retention-days: 30

      # ── Print download instructions ───────────────────────────────────────────
      - name: Build summary
        run: |
          if [ "${{ env.BT }}" = "store" ]; then
            echo "## ✅ Store-сборка готова (AAB + подписанный APK)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Артефакт \`family-budget-store-${{ github.run_number }}\` содержит оба файла:" >> $GITHUB_STEP_SUMMARY
            echo "- \`bundle/release/app-release.aab\` — для Google Play (или RuStore, если загрузить ключ подписи)" >> $GITHUB_STEP_SUMMARY
            echo "- \`apk/release/app-release.apk\` — подписан релизным ключом, **для RuStore заливай его** (ключ отдельно не нужен)" >> $GITHUB_STEP_SUMMARY
            echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ env.BT }}" = "demo" ]; then
            echo "## ✅ Демо-APK собран (\`Бюджет · Демо\`)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Отдельный package \`com.familybudget.app.demo\` — ставится **рядом** с основным." >> $GITHUB_STEP_SUMMARY
            echo "Вход: логин \`lena\` / пароль \`Lena\` (сервер уже прописан)." >> $GITHUB_STEP_SUMMARY
            echo "Скачать: Artifacts → \`family-budget-demo-${{ github.run_number }}\` → \`app-release.apk\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ APK собран" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Тип:** standalone (JS-бандл встроен, Metro не нужен)" >> $GITHUB_STEP_SUMMARY
            echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Скачать: Actions → этот запуск → Artifacts → \`family-budget-*\`" >> $GITHUB_STEP_SUMMARY
            echo "Установка: \`adb install app-release.apk\` или отправьте APK тестировщику напрямую." >> $GITHUB_STEP_SUMMARY
          fi
